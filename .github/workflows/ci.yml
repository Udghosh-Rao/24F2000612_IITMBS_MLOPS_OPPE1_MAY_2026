name: Stock Predictor MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/923576764337/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-mlops-ci@project-83abca74-808e-4448-be0.iam.gserviceaccount.com"

      - name: Pull reproducible DVC data
        run: |
          dvc pull data/v0.dvc
          dvc pull feature_repo/data/iteration1.parquet.dvc
          dvc pull ci_data/test.parquet.dvc
          dvc pull mlflow.db.dvc
          dvc pull mlruns.dvc
          dvc pull models/best_iteration_2.joblib.dvc

      - name: Run feature sanity tests
        run: pytest -v tests/test_features.py

      - name: Fetch MLflow model and evaluate
        run: python src/ci_evaluate.py

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Generate CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Stock Movement Predictor - CI Report" > report.md
          cat reports/metrics.md >> report.md
          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          cml publish reports/confusion_matrix.png --md >> report.md

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cml comment create report.md
          else
            cat report.md
          fi
