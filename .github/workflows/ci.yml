name: Stock Predictor MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pull DVC versioned data
        run: |
          dvc pull data/v0.dvc
          dvc pull ci_data/test.parquet.dvc
          dvc pull mlflow.db.dvc
          dvc pull mlruns.dvc

      - name: Run feature sanity tests
        run: pytest -v tests/test_features.py

      - name: Fetch MLflow model and evaluate
        run: python src/ci_evaluate.py

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Generate CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Stock Movement Predictor - CI Report" > report.md
          cat reports/metrics.md >> report.md
          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          cml publish reports/confusion_matrix.png --md >> report.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cml comment create report.md
          else
            cat report.md
          fi
