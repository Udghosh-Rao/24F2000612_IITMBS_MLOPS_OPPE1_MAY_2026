name: Stock Predictor MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, unit tests & Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit & API tests with coverage
        run: pytest -v --cov=src --cov-report=term-missing
      - name: Build inference image
        run: docker build -t ghcr.io/udghosh-rao/stock-movement-api:${{ github.sha }} .
      - name: Smoke-test container
        run: |
          docker run -d -p 8000:8000 --name api ghcr.io/udghosh-rao/stock-movement-api:${{ github.sha }}
          sleep 5 && curl -fsS localhost:8000/health && curl -fsS localhost:8000/metrics | head -5
      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ghcr.io/udghosh-rao/stock-movement-api:${{ github.sha }} ghcr.io/udghosh-rao/stock-movement-api:latest
          docker push ghcr.io/udghosh-rao/stock-movement-api:${{ github.sha }}
          docker push ghcr.io/udghosh-rao/stock-movement-api:latest

  evaluate:
    name: Evaluate registered model (DVC + MLflow + CML)
    needs: quality
    # OIDC auth to GCP is unavailable for PRs from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/923576764337/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-mlops-ci@project-83abca74-808e-4448-be0.iam.gserviceaccount.com"

      - name: Pull reproducible DVC data
        run: |
          dvc pull data/v0.dvc
          dvc pull feature_repo/data/iteration1.parquet.dvc
          dvc pull ci_data/test.parquet.dvc
          dvc pull mlflow.db.dvc
          dvc pull mlruns.dvc
          dvc pull models/best_iteration_2.joblib.dvc

      - name: Run feature sanity tests
        run: pytest -v

      - name: Fetch MLflow model and evaluate
        run: python -m src.ci_evaluate

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Generate CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Stock Movement Predictor - CI Report" > report.md
          cat reports/metrics.md >> report.md
          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          cml publish reports/confusion_matrix.png --md >> report.md

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cml comment create report.md
          else
            cat report.md
          fi
